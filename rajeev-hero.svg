<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="rs-title rs-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="rs-title">Rajeev Swami — Full-Stack Developer | Creative Technologist</title>
  <desc id="rs-desc">Burgundy animated banner with a technical grid, orbital geometry, a flowing path and a glowing underline.</desc>
  <defs>
    <linearGradient id="rs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B1A"/>
      <stop offset="0.55" stop-color="#0A1428"/>
      <stop offset="1" stop-color="#0F2A5C"/>
    </linearGradient>
    <radialGradient id="rs-glow-left" cx="0.1" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#1E4FA3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1E4FA3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rs-glow-right" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6FA3E0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6FA3E0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rs-sheen" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="140">
      <stop offset="0" stop-color="#BFD8F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#BFD8F7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#BFD8F7" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-600 0" to="1300 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rs-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E4FA3"/>
      <stop offset="0.5" stop-color="#6FA3E0"/>
      <stop offset="1" stop-color="#BFD8F7"/>
    </linearGradient>
    <linearGradient id="rs-path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E4FA3" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#6FA3E0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#BFD8F7" stop-opacity="0.3"/>
    </linearGradient>
    <pattern id="rs-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#BFD8F7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="rs-fade-grad" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.35" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="rs-fade"><rect width="1200" height="420" fill="url(#rs-fade-grad)"/></mask>
    <filter id="rs-blur" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rs-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Base (static fallback is complete without any motion) -->
  <rect width="1200" height="420" fill="url(#rs-bg)"/>
  <ellipse cx="170" cy="70" rx="520" ry="300" fill="url(#rs-glow-left)"/>
  <circle cx="990" cy="205" r="230" fill="url(#rs-glow-right)">
    <animate attributeName="r" values="215;245;215" dur="9s" repeatCount="indefinite"/>
  </circle>
  <rect width="1200" height="420" fill="url(#rs-grid)" mask="url(#rs-fade)"/>
  <rect class="mo" width="1200" height="420" fill="url(#rs-sheen)"/>

  <!-- Orbital geometry -->
  <g transform="translate(990 205)" fill="none" stroke="#6FA3E0" stroke-width="1">
    <circle r="150" stroke-opacity="0.22"/>
    <circle r="100" stroke-opacity="0.16" stroke-dasharray="2 8"/>
    <ellipse rx="190" ry="62" transform="rotate(-24)" stroke-opacity="0.28"/>
    <circle r="6" fill="#BFD8F7" stroke="none" cx="150" cy="0" opacity="0.9"/>
    <g class="mo">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
        <circle cx="150" cy="0" r="5" fill="#BFD8F7" stroke="none" filter="url(#rs-soft)"/>
        <circle cx="150" cy="0" r="2.5" fill="#EEF4FC" stroke="none"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite"/>
        <circle cx="-100" cy="0" r="3" fill="#6FA3E0" stroke="none"/>
      </g>
    </g>
    <circle r="3" fill="#EEF4FC" stroke="none" opacity="0.8"/>
  </g>

  <!-- Flowing path: faint full curve + animated bright segment -->
  <path d="M0 372 C 220 322, 380 424, 600 368 S 960 312, 1200 362" fill="none" stroke="url(#rs-path)" stroke-width="1.5" stroke-opacity="0.55"/>
  <path class="mo" d="M0 372 C 220 322, 380 424, 600 368 S 960 312, 1200 362" fill="none" stroke="#BFD8F7" stroke-width="2.5" stroke-linecap="round" pathLength="1000" stroke-dasharray="110 890" filter="url(#rs-blur)">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- Typography -->
  <text x="80" y="108" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" letter-spacing="5" fill="#6FA3E0">PYTHON  ·  DJANGO  ·  FASTAPI  ·  JAVASCRIPT</text>
  <text x="76" y="204" font-family="Georgia,'Times New Roman',serif" font-size="96" font-weight="700" fill="#EEF4FC">Rajeev Swami</text>
  <text x="80" y="256" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="33" letter-spacing="0.5" fill="#BFD8F7">Full-Stack Developer <tspan fill="#6FA3E0">|</tspan> Creative Technologist</text>

  <!-- Glowing underline -->
  <rect x="80" y="282" width="420" height="3" rx="1.5" fill="url(#rs-line)" filter="url(#rs-blur)"/>
  <circle class="mo" cy="283.5" r="4" fill="#EEF4FC" filter="url(#rs-blur)">
    <animate attributeName="cx" values="80;500;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="80" y="326" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" letter-spacing="3" fill="#6FA3E0" fill-opacity="0.85">JAIPUR, INDIA</text>

  <style>
    @media (prefers-reduced-motion: reduce) { .mo { display: none; } }
  </style>
</svg>
