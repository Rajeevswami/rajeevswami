<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-labelledby="rf-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="rf-title">Rajeev Swami — Full-Stack Developer | Creative Technologist</title>
  <defs>
    <linearGradient id="rf-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050B1A"/>
      <stop offset="0.5" stop-color="#0F2A5C"/>
      <stop offset="1" stop-color="#050B1A"/>
    </linearGradient>
    <linearGradient id="rf-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E4FA3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#BFD8F7"/>
      <stop offset="1" stop-color="#1E4FA3" stop-opacity="0"/>
    </linearGradient>
    <filter id="rf-glow" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="120" fill="url(#rf-bg)"/>
  <path d="M60 40 H1140" stroke="url(#rf-line)" stroke-width="1.5" filter="url(#rf-glow)"/>
  <circle class="mo" cy="40" r="3.5" fill="#EEF4FC" filter="url(#rf-glow)">
    <animate attributeName="cx" values="60;1140;60" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="82" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#BFD8F7">Rajeev Swami <tspan fill="#6FA3E0">·</tspan> Full-Stack Developer <tspan fill="#6FA3E0">|</tspan> Creative Technologist</text>
  <style>@media (prefers-reduced-motion: reduce) { .mo { display: none; } }</style>
</svg>
